<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fixture Decalque</title>
<meta name="description" content="Página de teste do Decalque">
<link rel="icon" href="/favicon.png">
<meta property="og:image" content="/og.png">
<link rel="stylesheet" href="{{REMOTE}}/remote.css">
<style>
@font-face { font-family: 'Brand Sans'; src: url('/fonts/brand.ttf') format('truetype'); font-weight: 400; font-style: normal; }
:root { --bg: #0b0b0f; --fg: #f4f4f5; --primary: #c6f432; --radius: 12px; --space: 16px; --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --unused: 3px; }
.dark { --bg: #ffffff; --fg: #111111; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 'Brand Sans', system-ui, sans-serif; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
h1 { font-size: 64px; line-height: 1.1; letter-spacing: -0.02em; margin: 48px 0 16px; font-weight: 700; }
h2 { font-size: 40px; line-height: 1.2; margin: 0 0 16px; }
p { margin: 0 0 16px; color: #a1a1aa; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; border-radius: 9999px; background: var(--primary); color: #0b0b0f; font-weight: 600; text-decoration: none; transition: transform .2s var(--ease-out), background-color .2s ease; }
.btn-ghost { background: transparent; color: var(--fg); border: 1px solid #27272a; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin: 32px 0; }
.card { position: relative; padding: 24px; border-radius: var(--radius); background: #18181b; border: 1px solid #27272a; box-shadow: 0 10px 30px -10px rgba(0,0,0,.5); }
.card::before { content: ""; position: absolute; top: 12px; right: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.card h3 { margin: 0 0 8px; font-size: 20px; }
.input { width: 100%; padding: 10px 14px; border-radius: 8px; border: 1px solid #3f3f46; background: #0b0b0f; color: var(--fg); font: inherit; }
.hero-bg { height: 200px; border-radius: var(--radius); background: url('/hero.png') center / cover no-repeat; }
.pill { display: inline-block; padding: 8px 16px; border-radius: 999px; background: #7c3aed; color: #fff; text-decoration: none; }
.md\:hover\:ring:hover { box-shadow: 0 0 0 4px #c6f432; }
.gradient { height: 40px; border-radius: 8px; background: linear-gradient(90deg, #7c3aed, #c6f432); }
.spinner { width: 24px; height: 24px; border: 3px solid #27272a; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.reveal { opacity: 0; transform: translateY(40px); transition: opacity .6s var(--ease-out), transform .6s var(--ease-out); }
.reveal.is-in { opacity: 1; transform: none; }
.spacer { height: 1400px; }
@media (min-width: 768px) { .grid { gap: 32px; } }
@media (max-width: 1023px) { h1 { font-size: 48px; } }
</style>
</head>
<body>
<svg style="display:none"><symbol id="icon-star" viewBox="0 0 24 24"><path d="M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"/></symbol></svg>
<header class="wrap">
  <h1>Decalque fixture</h1>
  <p>Texto de apoio com <a href="/docs">um link</a> no meio.</p>
  <a class="btn" href="/start">Começar <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  <a class="btn btn-ghost" href="/more">Saiba mais</a>
</header>
<main class="wrap">
  <div class="grid">
    <div class="card" id="card1"><h3>Plano Pro</h3><p>Tudo que você precisa.</p><svg class="icon" width="24" height="24" aria-label="estrela"><use href="#icon-star"/></svg></div>
    <div class="card"><h3>Plano Time</h3><p>Para equipes.</p><img src="/photo.png" srcset="/photo.png 1x, /photo-2x.png 2x" alt="Foto" width="64" height="64"></div>
    <div class="card"><h3>Plano Free</h3><p>Para começar.</p><input class="input" placeholder="Seu e-mail"></div>
  </div>
  <img src="/tight.png" srcset="/tight.png 1x,/tight-2x.png 2x" alt="srcset sem espaço" width="32" height="32">
  <a class="pill md:hover:ring" href="/pill">Pill</a>
  <div class="hero-bg"></div>
  <div class="gradient"></div>
  <div class="spinner"></div>
  <div id="waapi" style="width:20px;height:20px;background:#7c3aed"></div>
  <lottie-player src="/anim.json"></lottie-player>
  <div class="spacer"></div>
  <section class="grid">
    <div class="card reveal"><h3>Revelado 1</h3></div>
    <div class="card reveal"><h3>Revelado 2</h3></div>
    <div class="card reveal"><h3>Revelado 3</h3></div>
  </section>
  <div class="spacer"></div>
</main>
<script>
document.getElementById('waapi').animate([{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(1.3)', opacity: 0.5 }], { duration: 900, iterations: Infinity, direction: 'alternate', easing: 'ease-in-out' });
const io = new IntersectionObserver((es) => es.forEach((e) => e.isIntersecting && e.target.classList.add('is-in')), { threshold: 0.1 });
document.querySelectorAll('.reveal').forEach((el) => io.observe(el));
</script>
</body>
</html>
